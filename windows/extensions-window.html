<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:">
<title>官方更新与插件市场</title><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.55 Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#0f172a;background:#f8fafc}header{padding:24px 28px 18px;background:#fff;border-bottom:1px solid #e2e8f0}h1{margin:0;font-size:23px}header p{margin:6px 0 0;color:#64748b}.tabs{display:flex;gap:8px;margin-top:18px}.tabs button{border:0;border-radius:9px;padding:8px 14px;background:#e2e8f0;cursor:pointer}.tabs button.active{color:#fff;background:#0f172a}main{padding:24px 28px}.panel{display:none}.panel.active{display:block}.card{padding:18px;border:1px solid #e2e8f0;border-radius:14px;background:#fff;margin-bottom:12px}.row{display:flex;gap:14px;align-items:center;justify-content:space-between}.muted{color:#64748b}.warning{padding:12px 14px;border:1px solid #fed7aa;border-radius:10px;background:#fff7ed;color:#9a3412;margin-bottom:16px}button.action{border:0;border-radius:9px;padding:9px 14px;color:#fff;background:#2563eb;cursor:pointer}button.ghost{border:1px solid #cbd5e1;border-radius:9px;padding:8px 12px;background:#fff;cursor:pointer}select,input{height:40px;border:1px solid #cbd5e1;border-radius:9px;padding:0 10px;background:#fff}.market-tools{display:flex;gap:10px;margin-bottom:14px}.market-tools input{flex:1}.tags{font-size:12px;color:#64748b}.plugin h3{margin:0;font-size:16px}.plugin p{margin:8px 0;color:#475569}.actions{display:flex;gap:8px;flex-shrink:0}pre{white-space:pre-wrap;max-height:160px;overflow:auto;padding:12px;border-radius:10px;background:#0f172a;color:#cbd5e1;font-size:12px}#busy{display:none;position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:9;place-items:center}#busy.show{display:grid}#busy>div{width:min(620px,90vw);padding:20px;background:#fff;border-radius:15px}
</style></head><body><header><h1>官方更新与插件市场</h1><p>客户端版本 v1.1.0 · Harness 运行时与插件独立管理</p><div class="tabs"><button class="active" data-tab="official">官方 Harness 更新</button><button data-tab="market">第三方插件市场</button></div></header><main>
<section id="official" class="panel active"><div class="card"><div class="row"><div><strong>DeepSeek 官方 Harness</strong><div id="version-summary" class="muted">正在读取版本…</div></div><div><select id="versions"></select> <button id="install-runtime" class="action">安装并切换</button></div></div><p class="muted">这里只列出 DeepSeek 官方 npm 包 <code>@deepseek-ai/dsh</code> 的版本；默认随客户端提供当前验证版本。</p></div></section>
<section id="market" class="panel"><div class="warning"><strong>第三方社区目录</strong>：非 DeepSeek 官方或认可。安装插件等同于在本机运行第三方代码，请先查看源码和权限。</div><div class="market-tools"><input id="search" placeholder="搜索插件、说明或标签"><select id="category"><option value="">全部类别</option><option value="plugin">插件</option><option value="bundle">组合包</option></select></div><div id="market-meta" class="muted"></div><div id="plugins"></div></section>
</main><div id="busy"><div><strong>正在执行，请不要关闭窗口</strong><pre id="progress"></pre></div></div><script>
const api=window.extensionsApi;let state={versions:null,registry:null};const busy=document.querySelector('#busy'),progress=document.querySelector('#progress');
api.onProgress(line=>{progress.textContent+=(progress.textContent?'\n':'')+line;progress.scrollTop=progress.scrollHeight});
document.querySelectorAll('[data-tab]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-tab],.panel').forEach(x=>x.classList.remove('active'));button.classList.add('active');document.querySelector('#'+button.dataset.tab).classList.add('active')});
function setBusy(value){busy.classList.toggle('show',value);if(value)progress.textContent=''}
async function loadVersions(){try{const v=await api.versions();state.versions=v;document.querySelector('#version-summary').textContent=`当前 ${v.active}（${v.activeMode==='bundled'?'客户端内置':'已下载官方版本'}），官方最新 ${v.latest}${v.warning?'；'+v.warning:''}`;document.querySelector('#versions').innerHTML=v.versions.map(x=>`<option ${x===v.active?'selected':''}>${x}</option>`).join('')}catch(error){document.querySelector('#version-summary').textContent=`官方版本读取失败：${error.message||error}`}}
async function loadRegistry(){try{state.registry=await api.registry();document.querySelector('#market-meta').textContent=`目录更新：${state.registry.updated||'未知'} · 共 ${state.registry.plugins.length} 个通过目录结构验证的插件/组合包`;render()}catch(error){document.querySelector('#market-meta').textContent=`社区目录读取失败：${error.message||error}`}}
document.querySelector('#install-runtime').onclick=async()=>{setBusy(true);try{const result=await api.installRuntime(document.querySelector('#versions').value);if(!result.canceled)alert('安装完成，请退出并重新打开客户端。')}catch(error){alert(error.message||error)}finally{setBusy(false)}};
function render(){if(!state.registry)return;const q=document.querySelector('#search').value.trim().toLowerCase(),category=document.querySelector('#category').value;const items=state.registry.plugins.filter(p=>(!category||p.category===category)&&(!q||[p.name,p.repo,p.description,...p.tags].join(' ').toLowerCase().includes(q))).slice(0,100);document.querySelector('#plugins').innerHTML=items.map((p,i)=>`<div class="card plugin"><div class="row"><div><h3>${escapeHtml(p.name)}</h3><div class="muted">${escapeHtml(p.repo)} · ★ ${p.stars??'—'} · 验证于 ${escapeHtml(p.verifiedAgainst||'未知')}</div><p>${escapeHtml(p.description)}</p><div class="tags">${p.tags.map(escapeHtml).join(' · ')}</div></div><div class="actions"><button class="ghost" data-source="${i}">源码</button><button class="action" data-install="${i}">安装</button></div></div></div>`).join('')||'<div class="card muted">没有匹配的插件。</div>';document.querySelectorAll('[data-source]').forEach(b=>b.onclick=()=>api.openSource(items[+b.dataset.source].sourceUrl));document.querySelectorAll('[data-install]').forEach(b=>b.onclick=async()=>{setBusy(true);try{const result=await api.installPlugin(items[+b.dataset.install]);if(!result.canceled)alert('插件安装完成，请退出并重新打开客户端。')}catch(error){alert(error.message||error)}finally{setBusy(false)}})}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.querySelector('#search').oninput=render;document.querySelector('#category').onchange=render;loadVersions();loadRegistry();
</script></body></html>
