<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>DeepSeek yu 桌宠</title>
  <style>
    :root{color-scheme:light;--blue:#2563eb;--ink:#172554;--muted:#64748b;--glass:rgba(255,255,255,.96);--stage-glow:rgba(96,165,250,.16)}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;user-select:none}
    body{-webkit-app-region:no-drag}.pet-shell{position:relative;width:100%;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:5px 8px 8px;gap:6px}
    .status{position:absolute;z-index:8;top:4px;left:50%;transform:translateX(-50%) translateY(-7px);max-width:88%;padding:5px 10px;border:1px solid rgba(147,197,253,.72);border-radius:999px;background:var(--glass);box-shadow:0 8px 24px rgba(30,64,175,.17);color:var(--ink);font-size:11px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:.2s;pointer-events:none}.status.visible{opacity:1;transform:translateX(-50%) translateY(0)}
    .pet-stage{position:relative;z-index:1;width:100%;flex:1 1 auto;min-height:145px;padding-top:30px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:1px;cursor:grab;touch-action:none;outline:0}.pet-stage:active{cursor:grabbing}.pet-stage::before{content:"";position:absolute;left:50%;bottom:15px;width:64%;aspect-ratio:1;transform:translateX(-50%) scale(.82);border-radius:50%;background:radial-gradient(circle,var(--stage-glow),transparent 68%);opacity:.6;transition:.25s;pointer-events:none}
    .growth-2{--stage-glow:rgba(56,189,248,.24)}.growth-3{--stage-glow:rgba(99,102,241,.3)}.growth-4{--stage-glow:rgba(245,158,11,.34)}.growth-3 .pet-stage::before,.growth-4 .pet-stage::before{animation:aura 2.4s ease-in-out infinite}
    .pet-image{display:block;width:min(var(--pet-size,220px),100%);max-height:calc(100% - 22px);object-fit:contain;filter:drop-shadow(0 9px 9px rgba(15,23,42,.22));transform-origin:50% 90%;pointer-events:none;will-change:transform}
    .dynamic.state-idle .pet-image{animation:breathe 3.2s ease-in-out infinite}.dynamic.state-idle.idle-look .pet-image{animation:look 1.4s ease-in-out}.dynamic.state-idle.idle-hop .pet-image{animation:hop .9s ease-in-out}.dynamic.state-thinking .pet-image{animation:thinking 1.8s ease-in-out infinite}.dynamic.state-executing .pet-image{animation:working .55s ease-in-out infinite}.dynamic.state-success .pet-image{animation:celebrate .8s ease-out}.dynamic.state-error .pet-image{animation:disappointed 2s ease-in-out infinite}.dynamic.state-dragging .pet-image{animation:dragging .62s ease-in-out infinite}.dynamic.state-feeding .pet-image{animation:eating .52s ease-in-out infinite}.dynamic.state-levelup .pet-image{animation:levelup .75s ease-in-out infinite alternate}.dynamic.state-playing .pet-image{animation:playing .72s ease-in-out infinite}.dynamic.state-sleeping .pet-image{animation:sleeping 3.4s ease-in-out infinite}
    @keyframes breathe{0%,100%{transform:translateY(0) rotate(-.4deg) scale(1)}50%{transform:translateY(-6px) rotate(.5deg) scale(1.012)}}@keyframes look{0%,100%{transform:translateX(0) rotate(0)}35%{transform:translateX(-8px) rotate(-2deg)}70%{transform:translateX(5px) rotate(1.5deg)}}@keyframes hop{0%,100%{transform:translateY(0) scale(1)}45%{transform:translateY(-18px) scale(.98,1.03)}72%{transform:translateY(2px) scale(1.04,.96)}}@keyframes thinking{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg) translateY(-3px)}}@keyframes working{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.018)}}@keyframes celebrate{0%{transform:scale(.82) rotate(-5deg)}65%{transform:scale(1.08) rotate(2deg)}100%{transform:scale(1)}}@keyframes disappointed{0%,100%{transform:translateY(1px) rotate(-.7deg)}50%{transform:translateY(7px) rotate(.7deg)}}@keyframes dragging{0%,100%{transform:rotate(-5deg) translateY(-2px)}50%{transform:rotate(4deg) translateY(3px)}}@keyframes eating{0%,100%{transform:scale(1) translateY(0)}50%{transform:scale(1.025,.985) translateY(2px)}}@keyframes levelup{from{transform:translateY(3px) scale(.97);filter:drop-shadow(0 8px 9px rgba(15,23,42,.2))}to{transform:translateY(-12px) scale(1.04);filter:drop-shadow(0 0 16px rgba(59,130,246,.6))}}@keyframes playing{0%,100%{transform:translateX(-4px) rotate(-2deg)}50%{transform:translateX(5px) translateY(-8px) rotate(2deg)}}@keyframes sleeping{0%,100%{transform:translateY(1px) scale(1)}50%{transform:translateY(4px) scale(1.012,.988)}}@keyframes aura{0%,100%{opacity:.44;transform:translateX(-50%) scale(.75)}50%{opacity:.9;transform:translateX(-50%) scale(1)}}
    .pet-meta{position:relative;z-index:7;flex:none;display:flex;align-items:center;gap:4px;min-height:18px;padding:2px 7px;border:1px solid rgba(148,163,184,.3);border-radius:999px;background:rgba(255,255,255,.86);box-shadow:0 4px 12px rgba(15,23,42,.09);backdrop-filter:blur(7px);font-size:9px;color:#334155;pointer-events:none}.fish-count{font-weight:750;color:#b45309}.growth-name{max-width:72px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .drop-hint{position:absolute;z-index:12;inset:34px 8px 7px;display:none;align-items:center;justify-content:center;border:2px dashed #60a5fa;border-radius:18px;background:rgba(239,246,255,.93);color:#1d4ed8;text-align:center;font-size:12px;font-weight:700;pointer-events:none}.drop-target .drop-hint{display:flex}
    .quick-actions{position:absolute;z-index:50;isolation:isolate;right:9px;top:44px;width:27px;height:27px;opacity:.72;pointer-events:auto;transition:.18s}.pet-shell:hover .quick-actions,.quick-actions:focus-within,.actions-open .quick-actions{opacity:1}button{font:inherit}.menu-toggle{position:relative;z-index:2;width:27px;height:27px;padding:0;border:1px solid rgba(148,163,184,.38);border-radius:999px;background:rgba(255,255,255,.92);box-shadow:0 4px 11px rgba(15,23,42,.12);cursor:pointer;color:#334155;font-size:15px;line-height:1}.menu-toggle:hover,.actions-open .menu-toggle{background:#eff6ff;color:#1d4ed8}.action-menu{position:absolute;z-index:1;right:0;top:32px;width:142px;padding:6px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;border:1px solid rgba(148,163,184,.34);border-radius:13px;background:rgba(255,255,255,.96);box-shadow:0 10px 25px rgba(15,23,42,.18);backdrop-filter:blur(10px);opacity:0;transform:translateY(-5px) scale(.96);transform-origin:top right;pointer-events:none;transition:.16s}.actions-open .action-menu{opacity:1;transform:none;pointer-events:auto}.action-btn{height:29px;padding:0 7px;border:0;border-radius:8px;background:#f8fafc;color:#334155;cursor:pointer;font-size:10px;white-space:nowrap}.action-btn:hover{background:#eaf2ff;color:#1d4ed8}.action-btn.danger:hover{background:#fff1f2;color:#be123c}
    .chat-panel{width:100%;flex:0 0 152px;min-height:145px;display:flex;flex-direction:column;border:1px solid rgba(147,197,253,.7);border-radius:16px;background:var(--glass);box-shadow:0 10px 26px rgba(15,23,42,.18);overflow:hidden;transition:width .18s,flex-basis .18s,min-height .18s,border-radius .18s}.chat-panel.hidden{display:none}.chat-panel.collapsed{width:min(190px,88%);flex:0 0 38px;min-height:38px;border-radius:999px}.chat-panel.collapsed .messages,.chat-panel.collapsed .composer{display:none}.chat-panel.collapsed .panel-head{height:37px;border-bottom:0;padding:0 10px}
    .panel-head{height:38px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid #edf2f7;color:#334155;cursor:pointer}.state-dot{width:8px;height:8px;border-radius:999px;background:#94a3b8;box-shadow:0 0 0 3px #f1f5f9}.state-thinking .state-dot{background:#3b82f6}.state-executing .state-dot{background:#8b5cf6}.state-success .state-dot,.state-levelup .state-dot{background:#22c55e}.state-error .state-dot{background:#ef4444}.state-feeding .state-dot{background:#f59e0b}.state-playing .state-dot{background:#06b6d4}.state-sleeping .state-dot{background:#818cf8}.panel-status{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:650}.collapse{width:24px;height:24px;border:0;border-radius:999px;background:#f1f5f9;color:#64748b;cursor:pointer;font-size:10px}
    .messages{min-height:34px;flex:1;overflow:auto;padding:4px 8px 3px;display:flex;flex-direction:column;gap:5px;user-select:text;scrollbar-width:thin;scrollbar-gutter:stable}.empty{margin:auto;padding:3px;color:#94a3b8;text-align:center;font-size:10px}.message{max-width:90%;padding:5px 7px;border-radius:10px;color:#1e293b;font-size:10px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}.message.user{align-self:flex-end;background:#e8f1ff;color:#1e3a8a}.message.assistant{align-self:flex-start;background:#f1f5f9}.message.tool{align-self:stretch;max-width:none;padding:4px 6px;border:1px dashed #cbd5e1;background:#fff;color:#64748b;font-size:9px}.composer{flex:none;padding:5px 7px 7px;border-top:1px solid #edf2f7;background:rgba(248,250,252,.88)}textarea{display:block;width:100%;height:34px;resize:none;border:0;outline:0;background:transparent;padding:1px 2px 3px;color:#172554;font:11px/1.45 inherit;user-select:text}.composer-row{display:flex;align-items:center;gap:6px}.composer-hint{flex:1;min-width:0;color:#94a3b8;font-size:9px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.circle-action{width:27px;height:27px;border:0;border-radius:9px;cursor:pointer;font-weight:700}.attach{background:#eef2f7;color:#334155;font-size:16px}.send{background:#2563eb;color:white;font-size:14px}.circle-action:disabled{opacity:.45;cursor:default}
  </style>
</head>
<body>
  <main id="shell" class="pet-shell state-idle dynamic growth-1">
    <div id="status" class="status">准备好了</div>
    <section id="stage" class="pet-stage" aria-label="拖动桌宠或点击聊天"><img id="petImage" class="pet-image" alt="蓝鲸女仆桌宠"><div class="pet-meta"><span class="fish-count">🐟 <span id="fishCount">0</span></span><span>·</span><span id="growthName" class="growth-name">初次相遇</span></div></section>
    <div class="drop-hint">松开后确认<br>文件将移到回收站</div>
    <nav class="quick-actions" aria-label="桌宠快捷操作"><button id="menuButton" class="menu-toggle" title="更多操作" aria-expanded="false">⋯</button><div id="actionMenu" class="action-menu"><button id="feedButton" class="action-btn" title="消耗 1 条小鱼干">🐟 投喂</button><button id="playButton" class="action-btn">● 玩耍</button><button id="mainButton" class="action-btn">▣ 主窗口</button><button id="settingsButton" class="action-btn">⚙ 设置</button><button id="hideButton" class="action-btn danger">× 隐藏</button></div></nav>
    <section id="chatPanel" class="chat-panel" aria-label="桌宠聊天和进度"><header id="panelHead" class="panel-head"><span class="state-dot"></span><span id="panelStatus" class="panel-status">准备好了</span><button id="collapseButton" class="collapse" title="收起聊天面板">▼</button></header><div id="messages" class="messages"><div class="empty">这里会同步显示当前会话与执行进度</div></div><div class="composer"><textarea id="message" placeholder="给当前会话发消息…"></textarea><div class="composer-row"><span id="hint" class="composer-hint">Ctrl+Enter 发送 · ＋选择图片</span><button id="attachButton" class="circle-action attach" title="选择图片">＋</button><button id="sendButton" class="circle-action send" title="发送">↑</button></div></div></section>
  </main>
  <script>
    const shell=document.getElementById('shell'),stage=document.getElementById('stage'),image=document.getElementById('petImage'),status=document.getElementById('status'),panel=document.getElementById('chatPanel'),panelHead=document.getElementById('panelHead'),panelStatus=document.getElementById('panelStatus'),messageList=document.getElementById('messages'),message=document.getElementById('message'),send=document.getElementById('sendButton'),attach=document.getElementById('attachButton'),hint=document.getElementById('hint'),collapse=document.getElementById('collapseButton'),fishCount=document.getElementById('fishCount'),growthName=document.getElementById('growthName');
    let current={status:'idle',statusText:'准备好了',showStatus:true,showChatPanel:true,messages:[],actions:{},progress:{fish:0,growth:{number:1,name:'初次相遇'}}},collapsed=false,menuOpen=false,messageSignature='',pointer=null,dragging=false,dragStartPromise=null,dragMovePending=false,idleTimer=null;
    const errorText=error=>String(error?.message||error||'操作失败').replace(/^Error invoking remote method '[^']+': Error:\s*/,'');const labels={idle:'准备好了',thinking:'正在思考…',executing:'正在执行命令…',success:'完成啦',error:'遇到问题了',dragging:'要带我去哪里呀？',feeding:'小鱼干真好吃！',levelup:'我们的关系更近啦！',playing:'一起玩一会儿吧！',sleeping:'嘘…正在打盹'};
    function renderMessages(items){const signature=JSON.stringify(items||[]);if(signature===messageSignature)return;messageSignature=signature;messageList.innerHTML='';if(!items?.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='这里会同步显示当前会话与执行进度';messageList.appendChild(empty);return}for(const item of items){const bubble=document.createElement('div');bubble.className=`message ${item.role||'assistant'}`;bubble.textContent=item.text||'';messageList.appendChild(bubble)}messageList.scrollTop=messageList.scrollHeight}
    function render(next){current={...current,...next};const state=current.status||'idle',growth=current.progress?.growth||{number:1,name:'初次相遇'};shell.className=`pet-shell state-${state} growth-${growth.number}${current.dynamicActions===false?'':' dynamic'}${menuOpen?' actions-open':''}`;shell.style.setProperty('--pet-size',`${Number(current.petSize)||220}px`);const text=current.statusText||labels[state]||labels.idle;status.textContent=text;panelStatus.textContent=text;status.classList.toggle('visible',current.showStatus!==false);panel.classList.toggle('hidden',current.showChatPanel===false);fishCount.textContent=String(current.progress?.fish||0);growthName.textContent=`Lv.${growth.number} ${growth.name}`;growthName.title=`${growth.title||''} · 经验 ${current.progress?.experience||0}`;const url=current.actions?.[state]||current.actions?.idle;if(url&&image.src!==url)image.src=url;renderMessages(current.messages||[])}
    function setCollapsed(value){collapsed=value;panel.classList.toggle('collapsed',collapsed);collapse.textContent=collapsed?'▲':'▼';collapse.title=collapsed?'展开聊天面板':'收起聊天面板';window.desktopPet.setCollapsed(collapsed).catch(()=>{})}panelHead.addEventListener('click',event=>{if(event.target===collapse||event.target===panelHead||event.target===panelStatus)setCollapsed(!collapsed)});function focusChat(){if(current.showChatPanel!==false){setCollapsed(false);message.focus()}}
    stage.addEventListener('pointerdown',event=>{if(event.button!==0)return;pointer={id:event.pointerId,startX:event.screenX,startY:event.screenY};dragging=false;dragStartPromise=null;stage.setPointerCapture(event.pointerId)});stage.addEventListener('pointermove',event=>{if(!pointer||pointer.id!==event.pointerId)return;const moved=Math.hypot(event.screenX-pointer.startX,event.screenY-pointer.startY);if(!dragging&&moved>5){dragging=true;dragStartPromise=window.desktopPet.dragStart({screenX:pointer.startX,screenY:pointer.startY})}if(dragging&&!dragMovePending){dragMovePending=true;Promise.resolve(dragStartPromise).then(()=>window.desktopPet.dragMove({screenX:event.screenX,screenY:event.screenY})).catch(()=>{}).finally(()=>{dragMovePending=false})}});async function finishPointer(event){if(!pointer||pointer.id!==event.pointerId)return;const wasDragging=dragging,start=dragStartPromise;pointer=null;dragging=false;dragStartPromise=null;if(stage.hasPointerCapture(event.pointerId))stage.releasePointerCapture(event.pointerId);if(wasDragging){await Promise.resolve(start).catch(()=>{});await window.desktopPet.dragEnd().catch(()=>{})}else focusChat()}stage.addEventListener('pointerup',finishPointer);stage.addEventListener('pointercancel',finishPointer);
    let dragDepth=0;document.addEventListener('dragenter',event=>{if(event.dataTransfer?.types?.includes('Files')){event.preventDefault();dragDepth+=1;shell.classList.add('drop-target')}});document.addEventListener('dragover',event=>{if(event.dataTransfer?.types?.includes('Files')){event.preventDefault();event.dataTransfer.dropEffect='move'}});document.addEventListener('dragleave',()=>{dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)shell.classList.remove('drop-target')});document.addEventListener('drop',async event=>{event.preventDefault();dragDepth=0;shell.classList.remove('drop-target');const files=event.dataTransfer?.files;if(!files?.length)return;hint.textContent='等待确认是否移到回收站…';try{const result=await window.desktopPet.eatDroppedFiles(files);hint.textContent=result?.canceled?'已取消，文件未移动':'文件已移到回收站'}catch(error){hint.textContent=errorText(error)}});
    async function submit(){const value=message.value.trim();if(!value)return;send.disabled=true;hint.textContent='正在发送…';try{await window.desktopPet.sendMessage(value);message.value='';hint.textContent='已发送到当前会话'}catch(error){hint.textContent=errorText(error)}finally{send.disabled=false}}send.addEventListener('click',submit);message.addEventListener('keydown',event=>{if(event.key==='Enter'&&event.ctrlKey){event.preventDefault();submit()}});attach.addEventListener('click',async()=>{attach.disabled=true;hint.textContent='请选择图片';try{const result=await window.desktopPet.chooseImage(message.value.trim());if(!result?.canceled){message.value='';hint.textContent='已自动识别并发送'}}catch(error){hint.textContent=errorText(error)}finally{attach.disabled=false}});
    const menuButton=document.getElementById('menuButton'),actionMenu=document.getElementById('actionMenu');function setMenuOpen(value){menuOpen=Boolean(value);shell.classList.toggle('actions-open',menuOpen);menuButton.setAttribute('aria-expanded',String(menuOpen))}menuButton.addEventListener('click',event=>{event.stopPropagation();setMenuOpen(!menuOpen)});actionMenu.addEventListener('pointerdown',event=>event.stopPropagation());document.addEventListener('pointerdown',event=>{if(menuOpen&&!event.target.closest('.quick-actions'))setMenuOpen(false)});
    document.getElementById('feedButton').addEventListener('click',()=>{setMenuOpen(false);window.desktopPet.feed().catch(error=>{hint.textContent=errorText(error)})});document.getElementById('playButton').addEventListener('click',()=>{setMenuOpen(false);window.desktopPet.play().catch(()=>{})});document.getElementById('settingsButton').addEventListener('click',()=>{setMenuOpen(false);window.desktopPet.openSettings()});document.getElementById('hideButton').addEventListener('click',()=>{setMenuOpen(false);window.desktopPet.hide()});document.getElementById('mainButton').addEventListener('click',()=>{setMenuOpen(false);window.desktopPet.showMainWindow()});
    function scheduleIdleGesture(){clearTimeout(idleTimer);idleTimer=setTimeout(()=>{if(current.dynamicActions!==false&&current.status==='idle'){shell.classList.add(Math.random()>.45?'idle-hop':'idle-look');setTimeout(()=>shell.classList.remove('idle-hop','idle-look'),1500)}scheduleIdleGesture()},5000+Math.random()*7000)}window.desktopPet.onState(render);window.desktopPet.getState().then(value=>{render(value);scheduleIdleGesture()});
  </script>
</body>
</html>
