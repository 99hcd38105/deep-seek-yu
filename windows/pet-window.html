<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>DeepSeek yu 桌宠</title>
  <style>
    :root{color-scheme:light;--blue:#2563eb;--ink:#172554;--muted:#64748b;--glass:rgba(255,255,255,.96)}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;user-select:none}
    body{-webkit-app-region:drag}.pet-shell{position:relative;width:100%;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:6px 8px 8px;gap:7px}
    .status{position:absolute;z-index:5;top:5px;left:50%;transform:translateX(-50%) translateY(-7px);max-width:88%;padding:6px 11px;border:1px solid rgba(147,197,253,.72);border-radius:999px;background:var(--glass);box-shadow:0 8px 24px rgba(30,64,175,.17);color:var(--ink);font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:.2s;pointer-events:none}
    .status.visible{opacity:1;transform:translateX(-50%) translateY(0)}
    .pet-stage{position:relative;width:100%;flex:1 1 auto;min-height:150px;padding-top:27px;display:flex;align-items:flex-end;justify-content:center;cursor:pointer}
    .pet-image{display:block;width:min(var(--pet-size,220px),100%);max-height:100%;object-fit:contain;filter:drop-shadow(0 9px 9px rgba(15,23,42,.22));transform-origin:50% 92%;pointer-events:none}
    .state-idle .pet-image{animation:idle 3.2s ease-in-out infinite}.state-thinking .pet-image{animation:thinking 1.8s ease-in-out infinite}.state-executing .pet-image{animation:executing .55s ease-in-out infinite}.state-success .pet-image{animation:success .7s ease-out}.state-error .pet-image{animation:error 2s ease-in-out infinite}
    @keyframes idle{0%,100%{transform:translateY(0) rotate(-.4deg)}50%{transform:translateY(-7px) rotate(.5deg)}}
    @keyframes thinking{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg) translateY(-3px)}}
    @keyframes executing{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.015)}}
    @keyframes success{0%{transform:scale(.82) rotate(-5deg)}65%{transform:scale(1.08) rotate(2deg)}100%{transform:scale(1)}}
    @keyframes error{0%,100%{transform:translateY(2px)}50%{transform:translateY(6px)}}
    .quick-actions{position:absolute;z-index:6;right:12px;top:48px;display:flex;flex-direction:row;gap:6px;opacity:0;transform:translateY(-4px);transition:.18s;-webkit-app-region:no-drag}.pet-shell:hover .quick-actions,.quick-actions:focus-within{opacity:1;transform:none}
    button{font:inherit}.icon-btn{width:30px;height:30px;padding:0;border:1px solid rgba(148,163,184,.4);border-radius:10px;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);box-shadow:0 5px 14px rgba(15,23,42,.12);cursor:pointer;color:#334155}.icon-btn:hover{background:#eff6ff;color:#1d4ed8}
    .chat-panel{width:100%;flex:0 0 152px;min-height:145px;display:flex;flex-direction:column;border:1px solid rgba(147,197,253,.7);border-radius:16px;background:var(--glass);box-shadow:0 10px 26px rgba(15,23,42,.18);overflow:hidden;-webkit-app-region:no-drag;transition:width .18s,flex-basis .18s,min-height .18s,border-radius .18s}
    .chat-panel.hidden{display:none}.chat-panel.collapsed{width:min(190px,88%);flex:0 0 38px;min-height:38px;border-radius:999px}.chat-panel.collapsed .messages,.chat-panel.collapsed .composer{display:none}.chat-panel.collapsed .panel-head{height:37px;border-bottom:0;padding:0 10px}
    .panel-head{height:38px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid #edf2f7;color:#334155;cursor:pointer}
    .state-dot{width:8px;height:8px;border-radius:999px;background:#94a3b8;box-shadow:0 0 0 3px #f1f5f9}.state-thinking .state-dot{background:#3b82f6}.state-executing .state-dot{background:#8b5cf6}.state-success .state-dot{background:#22c55e}.state-error .state-dot{background:#ef4444}
    .panel-status{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:650}.collapse{width:24px;height:24px;border:0;border-radius:999px;background:#f1f5f9;color:#64748b;cursor:pointer;font-size:10px}.collapse:hover{background:#dbeafe;color:#1d4ed8}
    .messages{min-height:34px;flex:1;overflow:auto;padding:4px 8px 3px;display:flex;flex-direction:column;gap:5px;user-select:text;scrollbar-width:thin;scrollbar-gutter:stable}
    .empty{margin:auto;padding:3px;color:#94a3b8;text-align:center;font-size:10px}.message{max-width:90%;padding:5px 7px;border-radius:10px;color:#1e293b;font-size:10px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}.message.user{align-self:flex-end;background:#e8f1ff;color:#1e3a8a}.message.assistant{align-self:flex-start;background:#f1f5f9}.message.tool{align-self:stretch;max-width:none;padding:4px 6px;border:1px dashed #cbd5e1;background:#fff;color:#64748b;font-size:9px}
    .composer{flex:none;padding:5px 7px 7px;border-top:1px solid #edf2f7;background:rgba(248,250,252,.88)}
    textarea{display:block;width:100%;height:34px;resize:none;border:0;outline:0;background:transparent;padding:1px 2px 3px;color:#172554;font:11px/1.45 inherit;user-select:text}
    .composer-row{display:flex;align-items:center;gap:6px}.composer-hint{flex:1;min-width:0;color:#94a3b8;font-size:9px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.circle-action{width:27px;height:27px;border:0;border-radius:9px;cursor:pointer;font-weight:700}.attach{background:#eef2f7;color:#334155;font-size:16px}.send{background:#2563eb;color:white;font-size:14px}.circle-action:hover{filter:brightness(.96)}.circle-action:disabled{opacity:.45;cursor:default}
  </style>
</head>
<body>
  <main id="shell" class="pet-shell state-idle">
    <div id="status" class="status">准备好了</div>
    <section id="stage" class="pet-stage" aria-label="点击输入消息"><img id="petImage" class="pet-image" alt="桌宠"></section>
    <nav class="quick-actions" aria-label="桌宠快捷操作">
      <button id="mainButton" class="icon-btn" title="打开 Harness 主窗口">▣</button>
      <button id="settingsButton" class="icon-btn" title="桌宠设置">⚙</button>
      <button id="hideButton" class="icon-btn" title="隐藏桌宠">×</button>
    </nav>
    <section id="chatPanel" class="chat-panel" aria-label="桌宠聊天和进度">
      <header id="panelHead" class="panel-head"><span class="state-dot"></span><span id="panelStatus" class="panel-status">准备好了</span><button id="collapseButton" class="collapse" title="收起聊天面板">▼</button></header>
      <div id="messages" class="messages"><div class="empty">这里会同步显示当前会话与执行进度</div></div>
      <div class="composer">
        <textarea id="message" placeholder="给当前会话发消息…"></textarea>
        <div class="composer-row"><span id="hint" class="composer-hint">Ctrl+Enter 发送 · ＋选择图片</span><button id="attachButton" class="circle-action attach" title="选择图片">＋</button><button id="sendButton" class="circle-action send" title="发送">↑</button></div>
      </div>
    </section>
  </main>
  <script>
    const shell=document.getElementById('shell');const stage=document.getElementById('stage');const image=document.getElementById('petImage');const status=document.getElementById('status');const panel=document.getElementById('chatPanel');const panelHead=document.getElementById('panelHead');const panelStatus=document.getElementById('panelStatus');const messageList=document.getElementById('messages');const message=document.getElementById('message');const send=document.getElementById('sendButton');const attach=document.getElementById('attachButton');const hint=document.getElementById('hint');const collapse=document.getElementById('collapseButton');
    let current={status:'idle',statusText:'准备好了',showStatus:true,showChatPanel:true,messages:[],actions:{}};let collapsed=false;let messageSignature='';const errorText=error=>String(error?.message||error||'操作失败').replace(/^Error invoking remote method '[^']+': Error:\s*/,'');
    const labels={idle:'准备好了',thinking:'正在思考…',executing:'正在执行命令…',success:'完成啦',error:'遇到问题了'};
    function renderMessages(items){const signature=JSON.stringify(items||[]);if(signature===messageSignature)return;messageSignature=signature;messageList.innerHTML='';if(!items?.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='这里会同步显示当前会话与执行进度';messageList.appendChild(empty);return}for(const item of items){const bubble=document.createElement('div');bubble.className=`message ${item.role||'assistant'}`;bubble.textContent=item.text||'';messageList.appendChild(bubble)}messageList.scrollTop=messageList.scrollHeight}
    function render(next){current={...current,...next};const state=current.status||'idle';shell.className=`pet-shell state-${state}`;shell.style.setProperty('--pet-size',`${Number(current.petSize)||220}px`);const text=current.statusText||labels[state]||labels.idle;status.textContent=text;panelStatus.textContent=text;status.classList.toggle('visible',current.showStatus!==false);panel.classList.toggle('hidden',current.showChatPanel===false);const url=(current.actions&&current.actions[state])||(current.actions&&current.actions.idle);if(url&&image.src!==url)image.src=url;renderMessages(current.messages||[])}
    function setCollapsed(value){collapsed=value;panel.classList.toggle('collapsed',collapsed);collapse.textContent=collapsed?'▲':'▼';collapse.title=collapsed?'展开聊天面板':'收起聊天面板';window.desktopPet.setCollapsed(collapsed).catch(()=>{})}
    panelHead.addEventListener('click',event=>{if(event.target===collapse||event.target===panelHead||event.target===panelStatus)setCollapsed(!collapsed)});
    stage.addEventListener('click',()=>{if(current.showChatPanel!==false){setCollapsed(false);message.focus()}});
    async function submit(){const value=message.value.trim();if(!value)return;send.disabled=true;hint.textContent='正在发送…';try{await window.desktopPet.sendMessage(value);message.value='';hint.textContent='已发送到当前会话'}catch(error){hint.textContent=errorText(error)}finally{send.disabled=false}}
    send.addEventListener('click',submit);message.addEventListener('keydown',event=>{if(event.key==='Enter'&&event.ctrlKey){event.preventDefault();submit()}});
    attach.addEventListener('click',async()=>{attach.disabled=true;hint.textContent='请选择图片';try{const result=await window.desktopPet.chooseImage(message.value.trim());if(!result?.canceled){message.value='';hint.textContent='已自动识别并发送'}}catch(error){hint.textContent=errorText(error)}finally{attach.disabled=false}});
    document.getElementById('settingsButton').addEventListener('click',()=>window.desktopPet.openSettings());document.getElementById('hideButton').addEventListener('click',()=>window.desktopPet.hide());document.getElementById('mainButton').addEventListener('click',()=>window.desktopPet.showMainWindow());
    window.desktopPet.onState(render);window.desktopPet.getState().then(render);
  </script>
</body>
</html>
