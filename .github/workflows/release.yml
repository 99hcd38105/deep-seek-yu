name: Build and publish DeepSeek yu installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Verify release version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw windows/package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$version"
          }

      - name: Build Android APK
        shell: pwsh
        run: .\android\gradlew.bat -p android assembleDebug --no-daemon

      - name: Include Android APK in Windows package
        shell: pwsh
        run: Copy-Item android\app\build\outputs\apk\debug\app-debug.apk windows\assets\deep-seek-yu-Android.apk

      - name: Install Windows dependencies
        shell: pwsh
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: npm ci --prefix windows

      - name: Prepare Electron runtime
        shell: pwsh
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: |
          $electronExecutable = 'windows\node_modules\electron\dist\electron.exe'
          if (-not (Test-Path $electronExecutable)) {
            Push-Location windows
            try {
              node node_modules\electron\install.js
              if ($LASTEXITCODE -ne 0) {
                throw "Electron runtime installer exited with code $LASTEXITCODE"
              }
            } finally {
              Pop-Location
            }
          }
          if (-not (Test-Path $electronExecutable)) {
            throw "Electron runtime was not prepared at $electronExecutable"
          }
          & $electronExecutable --version

      - name: Build Windows installer
        shell: pwsh
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: npm run installer --prefix windows -- --publish never

      - name: Prepare release files
        shell: pwsh
        run: |
          $version = (Get-Content -Raw windows/package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item "windows\installer\deep-seek-yu-Setup-$version.exe" "release\deep-seek-yu-Setup-$version.exe"
          Copy-Item android\app\build\outputs\apk\debug\app-debug.apk "release\deep-seek-yu-Android-$version.apk"
          Get-FileHash -Algorithm SHA256 release\*.exe,release\*.apk |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding ascii release\SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deep-seek-yu-${{ github.ref_name }}
          path: release/*

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $releaseFiles = Get-ChildItem -Path release -File | ForEach-Object { $_.FullName }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @releaseFiles --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to replace assets on existing release $tag"
            }
            $channel = (Get-Content -Raw windows/package.json | ConvertFrom-Json).releaseChannel
            if ($tag -match '-' -or $channel -in @('beta', 'test', 'prerelease')) {
              gh release edit $tag --prerelease
            } else {
              gh release edit $tag --prerelease=false --latest
            }
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to update release channel for $tag"
            }
          } else {
            $arguments = @($tag) + @($releaseFiles) + @(
              '--verify-tag',
              '--generate-notes',
              '--title', "DeepSeek yu $tag"
            )
            $channel = (Get-Content -Raw windows/package.json | ConvertFrom-Json).releaseChannel
            if ($tag -match '-' -or $channel -in @('beta', 'test', 'prerelease')) {
              $arguments += '--prerelease'
            }
            gh release create @arguments
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create release $tag"
            }
          }
